allowBuilds:
  esbuild: true
  simple-git-hooks: true

overrides:
  'uuid@<11.1.1': '>=11.1.1'

# Our lockfile is already trusted (committed, reviewed by us); disable the
# minimum-release-age supply-chain check so EAS Build's `pnpm install` doesn't
# fail when a frequently-updated transitive dep (e.g. @types/react,
# electron-to-chromium) was published in the last 24h.
minimumReleaseAge: 0
